# Preview do export estático, imitando o S3: `/rota/` serve `rota/index.html`
# e o que não existe cai no 404.html gerado pelo Next.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem isso, o redirect de `/rota` para `/rota/` apontaria para a porta 80
    # do container em vez da porta publicada no host.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
